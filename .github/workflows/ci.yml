# Lint + tests on Linux, Windows and macOS for every pull request and every push to main.
# No secrets: the tests never talk to Telegram, an AI provider or the internet.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # manual run from the Actions tab, e.g. for a branch without a PR

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on Linux; the oldest and newest on Windows and macOS.
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.14" }
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
      - name: CLI starts
        run: python -m petbot --help

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Shell scripts parse and pass shellcheck (errors only)
        run: |
          for f in run.sh deploy/linux/*.sh; do bash -n "$f"; shellcheck -S error "$f"; done
      - name: Windows scripts keep CRLF
        run: |
          for f in *.bat deploy/windows/*; do grep -q $'\r' "$f" || { echo "$f has LF endings"; exit 1; }; done
