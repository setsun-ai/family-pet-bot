# Weekly update PRs for Python packages and GitHub Actions; CI runs on each one.
# Minor and patch bumps arrive grouped in one PR per ecosystem, major bumps one by one.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
