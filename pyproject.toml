[project]
name = "family-pet-bot"
version = "1.0.0"
description = "An AI pet character for your family Telegram chat: conversation, daily good news and your team's matches. English and Russian."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["telegram-bot", "family", "ai", "claude", "openai", "aiogram", "raspberry-pi"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long user-facing strings and prompts are fine

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
